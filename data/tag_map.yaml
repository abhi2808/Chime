# Chime tag map (SPEC section 5, step 3)
#
# Maps a genre or tag to an energy level and session affinities. A track's tags are the
# weighted average of the entries it matches, so this table is the whole of Chime's
# musical taste: tune it here, no code changes.
#
# Authored from the public genre vocabulary (MusicBrainz genres, common folksonomy
# tags). It is deliberately NOT derived from anyone's Spotify library.
#
#   energy   1-5. 1 = barely moving, 3 = neutral, 5 = flat out.
#   weight   how much this entry counts in the average (default 1.0). Umbrella tags
#            like "rock" get less, so a precise match like "shoegaze" wins when both hit.
#   affinities: calm, focus, workout, wind_down, wake_up, each 0-1. Omit = 0.
#
# Matching is case-insensitive and punctuation-insensitive (see app/services/tagging.py),
# so "Hip-Hop", "hip hop" and "HIP HOP" are the same key. Use `aliases` only for
# genuinely different words.
#
# Three sections, in the order they are applied:
#   aliases  spelling -> canonical tag name
#   tags     the table itself
#   ignore   real tags that carry no energy information (see the note above that list)

version: 1

aliases:
  alternative: alternative rock
  dnb: drum and bass
  d&b: drum and bass
  "drum & bass": drum and bass
  "drum n bass": drum and bass
  edm: electronic
  electronica: electronic
  hiphop: hip hop
  rap: hip hop
  rnb: r&b
  "rhythm and blues": r&b
